<style>
  .nav-item {
    position: relative;
    padding: 0.5rem 0;
  }

  .nav-item::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 2px;
    bottom: 0;
    left: 0;
    background-color: white;
    transform: scaleX(0);
    transform-origin: right;
    transition: transform 0.3s ease-in-out;
  }

  .nav-item:hover::after {
    transform: scaleX(1);
    transform-origin: left;
  }

  .nav-item a {
    font-family: "Poppins", sans-serif;
    font-weight: 500;
    letter-spacing: 0.5px;
    transition: color 0.3s ease-in-out;
    display: flex;
    align-items: center;
    gap: 0.5rem; /* Espacio entre el ícono y el texto */
  }

  .nav-item a:hover {
    color: #fecaca; /* Cambia el color al hacer hover */
  }
</style>


<header class="bg-red-600 text-white p-4 shadow-lg sticky top-0 z-50">
  <div class="container mx-auto flex justify-between items-center">
    <!-- Logo y nombre del proyecto -->
    <div class="flex items-center">
      <img
        src="assets/logoU3.png"
        alt="Logo UFPSO"
        class="h-12 md:h-16 mr-3 bg-white rounded-md border-white border-2"
      />
      <h1 class="text-xl md:text-2xl font-bold font-poppins shrink-0">ZooTracker</h1>
    </div>

    <!-- Botón Hamburguesa (Solo móvil) -->
    <button 
      (click)="toggleMenu()" 
      class="lg:hidden p-2 focus:outline-none focus:ring-2 focus:ring-white rounded-md flex items-center justify-center transition-all duration-300"
      aria-label="Menu"
    >
      <!-- Icono de Hamburguesa (Cerrado) -->
      <svg *ngIf="!isMenuOpen" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
      <!-- Icono de X (Abierto) -->
      <svg *ngIf="isMenuOpen" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

    <!-- Menú de navegación -->
    <nav 
      class="lg:flex"
      [ngClass]="{
        'hidden': !isMenuOpen,
        'flex flex-col absolute top-full left-0 w-full bg-red-600 p-4 border-t border-red-500 shadow-xl lg:static lg:flex-row lg:w-auto lg:p-0 lg:border-none lg:shadow-none': true
      }"
    >
      <ul class="flex flex-col lg:flex-row lg:space-x-8 space-y-4 lg:space-y-0">
        <!-- Registros -->
        <li class="nav-item" *ngIf="isLoggedIn$ | async">
          <a
            routerLink="/registros"
            routerLinkActive="active"
            class="text-lg hover:text-red-200"
            (click)="isMenuOpen = false"
          >
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
            </svg>
            Registros
          </a>
        </li>

        <!-- Reportes -->
        <li class="nav-item" *ngIf="isLoggedIn$ | async">
          <a
            routerLink="/reportes"
            routerLinkActive="active"
            class="text-lg hover:text-red-200"
            (click)="isMenuOpen = false"
          >
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
            </svg>
            Reportes
          </a>
        </li>

        <!-- Inventario -->
        <li class="nav-item" *ngIf="isLoggedIn$ | async">
          <a
            routerLink="/inventario"
            routerLinkActive="active"
            class="text-lg hover:text-red-200"
            (click)="isMenuOpen = false"
          >
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
            </svg>
            Inventario
          </a>
        </li>

        <!-- user-crud -->
        <li class="nav-item" *ngIf="isLoggedIn$ | async">
          <a
            routerLink="/userCrud"
            routerLinkActive="active"
            class="text-lg hover:text-red-200"
            (click)="isMenuOpen = false"
          >
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5 0a2.25 2.25 0 00-2.25-2.25 2.25 2.25 0 00-2.25 2.25v6.75m11.25-6.75a2.25 2.25 0 01-2.25 2.25 2.25 2.25 0 01-2.25-2.25V4.5m1.5 12h-9m10.5-3v3m-12-3v3" />
            </svg>
            User Crud
          </a>
        </li>

        <!-- Audit -->
        <li class="nav-item" *ngIf="isLoggedIn$ | async">
          <a
            routerLink="/audit"
            routerLinkActive="active"
            class="text-lg hover:text-red-200"
            (click)="isMenuOpen = false"
          >
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
            </svg>
            Auditoria
          </a>
        </li>

        <!-- Login y Cerrar Sesion-->
        <li class="nav-item">
          <ng-container *ngIf="isLoggedIn$ | async; else loginBtn">
            <a (click)="logout(); isMenuOpen = false" class="text-lg hover:text-red-200 cursor-pointer">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
            </svg>
            Cerrar Sesión
            </a>
          </ng-container>
          <ng-template #loginBtn>
            <a
              routerLink="/login"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              class="text-lg hover:text-red-200"
              (click)="isMenuOpen = false"
            >
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
            </svg>
            Login
            </a>
          </ng-template>
        </li>
      </ul>
    </nav>
  </div>
</header>
